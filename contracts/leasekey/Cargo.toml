[package]
name = "leasekey"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LeaseKey factory: NEP-171 NFT contract that gives every item its own NEAR account"
repository = "https://github.com/amannx21/LEASEKEY"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
