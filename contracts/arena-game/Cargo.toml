[package]
name = "arena-game"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Slime Arena: a demo game that integrates LeaseKey purely through its public interface"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
