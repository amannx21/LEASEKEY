[package]
name = "demo-nft"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A stand-in for another game's NEP-171 item collection, used to demo wrapping"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
